name: Generate provider configs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate configs
        run: |
          for script in ./*.sh; do
            "$script"
          done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view files >/dev/null 2>&1 \
            || gh release create files --title "Provider configs" --notes "Generated opencode provider configs"
          gh release upload files results/*.json --clobber
